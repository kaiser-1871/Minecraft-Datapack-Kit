name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fixed cache location (NOT under $HOME): cli-smoke tests isolate HOME, and on Linux
      # env-paths resolves the Spyglass cache from XDG_CACHE_HOME / ~/.cache — without this
      # the tests can't see the pre-warmed data and every offline query fails.
      # (runner.temp is NOT available in job-level env — only in step-level env — so use a
      # stable /tmp path instead of ${{ runner.temp }}.)
      XDG_CACHE_HOME: /tmp/spyglass-cache
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-node${{ matrix.node-version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Reuse the pre-warmed Spyglass cache across runs: api.spyglassmc.com throttles the
      # parallel matrix jobs (transient 502s on old-version data), and a full pre-warm takes
      # minutes. With actions/cache, only the first run (or a cache miss) downloads.
      - name: Restore Spyglass cache
        id: spyglass-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/spyglass-cache
          key: spyglass-cache-${{ runner.os }}-${{ hashFiles('vendor/spyglass/BUILD.json') }}
      # Three parallel matrix jobs pre-warming the same upstream endpoints can hit transient
      # HTTP 502s (upstream throttling — verified: the same downloads succeed locally and in
      # single-job runs); --cache-versions is idempotent (skips already-cached versions), so
      # retry until every version is cached. The loop must fail loudly when it never succeeds
      # (a trailing `sleep 15` would otherwise make the step exit 0 with data still missing).
      - name: Pre-warm version data (retry transient 502s)
        if: steps.spyglass-cache.outputs.cache-hit != 'true'
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "=== cache-versions attempt $attempt ==="
            if node dpkit.mjs --cache-versions=1.14,1.15.2,1.16.5,1.18.2,1.19.4,1.20.4,1.21.4,1.21.11,26.2; then
              echo "pre-warm complete"
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::pre-warm failed after 8 attempts"
            exit 1
          fi
      - name: Save Spyglass cache
        # Only the Node 22 job saves — three parallel jobs writing the same cache key
        # would race (last-writer-wins) and waste time re-uploading.
        if: always() && steps.spyglass-cache.outputs.cache-hit != 'true' && matrix.node-version == 22
        uses: actions/cache/save@v4
        with:
          path: /tmp/spyglass-cache
          key: spyglass-cache-${{ runner.os }}-${{ hashFiles('vendor/spyglass/BUILD.json') }}
      # Note: bare `node --test` (no args) recursively finds tests/**/*.test.mjs on Node
      # 20/22/24 alike — Node 20 does NOT support glob arguments (tests/**/*.test.mjs), and
      # directory args misbehave on some platforms. Non-.test. files (multi-version.spec.mjs,
      # mcp-smoke.mjs, parity.mjs) are intentionally excluded; they run as separate steps.
      - run: node --test
      - name: multi-version matrix
        env:
          DPKIT_TEST_VERSIONS: 1.14,1.15.2,1.16.5,1.18.2,1.19.4,1.20.4,1.21.4,1.21.11,26.2
        run: node --test tests/multi-version.spec.mjs
      - run: node tests/mcp-smoke.mjs
      - name: parity across cached releases
        run: |
          for v in 1.14 1.15.2 1.16.5 1.18.2 1.19.4 1.20.4 1.21.4 1.21.11 26.2; do
            echo "::group::parity $v"
            DPKIT_PARITY_VERSION="$v" node tests/parity.mjs
            echo "::endgroup::"
          done
